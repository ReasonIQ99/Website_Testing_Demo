<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Test - ReasonIQ99</title><style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f6f7fb;color:#171717}.header{background:white;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0}.logo{font-weight:850;color:#6c3bff}.timer{background:#ffefef;color:#c62828;padding:7px 13px;border-radius:20px;font-weight:750}.container{display:flex;max-width:1100px;margin:auto;align-items:flex-start}.main,.sidebar,#result{background:white;border-radius:14px;margin:16px;padding:20px;box-shadow:0 4px 20px #00000006}.main{flex:1;min-width:0}.sidebar{width:260px;flex-shrink:0;position:sticky;top:76px}.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.q-btn{height:38px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer;font-weight:700}.q-btn.active{background:#6c3bff;color:white;border-color:#6c3bff}.q-btn.answered{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}.q-btn.visited{background:#fff8e1;border-color:#ffb74d}.question{font-size:19px;line-height:1.5;font-weight:700;margin:16px 0}.opt{width:100%;text-align:left;padding:13px;border:2px solid #eee;border-radius:11px;display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer;background:white}.opt.selected{border-color:#6c3bff;background:#f0eaff}.letter{width:28px;height:28px;border:2px solid #ccc;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}.selected .letter{background:#6c3bff;color:white;border-color:#6c3bff}.btn{padding:11px 15px;border-radius:9px;border:0;font-weight:750;cursor:pointer}.primary{background:#6c3bff;color:white}.outline{background:white;border:1px solid #ddd}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid #eee}.muted{font-size:13px;color:#666;line-height:1.5}#result{display:none;max-width:760px;margin:28px auto;text-align:center}.score{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#6c3bff,#9b7aff);color:white;display:grid;place-content:center;margin:0 auto 18px;font-size:30px;font-weight:850}.review{text-align:left;margin-top:24px}.review-item{padding:14px 0;border-bottom:1px solid #eee;line-height:1.5}.correct{color:#2e7d32}.wrong{color:#c62828}@media(max-width:760px){.container{flex-direction:column}.main{order:1;margin:12px;width:calc(100% - 24px)}.sidebar{order:2;position:static;width:calc(100% - 24px);margin:0 12px 12px}.header{padding:12px}}
</style></head><body><header class="header"><div class="logo" id="testLogo">ReasonIQ99 • Mock Test</div><div class="timer" id="timer">20:00</div></header><div class="container" id="quizContainer"><main class="main"><div id="qNumber" style="color:#6c3bff;font-weight:750"></div><div class="question" id="questionText"></div><div id="optionsBox"></div><div class="controls"><div><button class="btn outline" id="prev">← Previous</button> <button class="btn outline" id="clear">Clear</button></div><button class="btn primary" id="next">Save & Next →</button></div></main><aside class="sidebar"><h3>Questions Map</h3><p class="muted" style="margin-top:6px">Green = answered, purple = current.</p><div class="q-grid" id="qGrid"></div><button class="btn primary" id="submit" style="width:100%;margin-top:16px">Submit Test</button></aside></div><section id="result"><div class="score" id="scoreNum">0/0</div><h2 id="resultTitle">Test complete!</h2><p id="resultDesc" class="muted" style="margin:10px"></p><a class="btn primary" href="index.html">Go Home</a> <button class="btn outline" onclick="location.reload()">Try Again</button><div class="review" id="review"></div></section>
<script src="data.js"></script><script>
const p=new URLSearchParams(location.search),testId=p.get('id')||'mock1',QUESTIONS=MOCK_QUESTIONS[testId]||MOCK_QUESTIONS.mock1,info=TEST_LIST.find(t=>t.id===testId);document.getElementById('testLogo').textContent=info?info.name:'ReasonIQ99 • Test';
let current=0,answers=Array(QUESTIONS.length).fill(null),visited=Array(QUESTIONS.length).fill(false),time=Number((info?.time||'20').match(/\\d+/)[0])*60,submitted=false,timerInt;
function renderQ(){visited[current]=true;document.getElementById('qNumber').textContent=`Question ${current+1} / ${QUESTIONS.length}`;document.getElementById('questionText').textContent=QUESTIONS[current].q;let box=document.getElementById('optionsBox');box.innerHTML='';QUESTIONS[current].options.forEach((op,i)=>{let b=document.createElement('button');b.className='opt'+(answers[current]===i?' selected':'');let l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+i);let tx=document.createElement('span');tx.textContent=op;b.append(l,tx);b.onclick=()=>{answers[current]=i;renderQ()};box.append(b)});document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===QUESTIONS.length-1;renderGrid()}
function renderGrid(){let g=document.getElementById('qGrid');g.innerHTML='';QUESTIONS.forEach((_,i)=>{let b=document.createElement('button');b.className='q-btn '+(i===current?'active':answers[i]!==null?'answered':visited[i]?'visited':'');b.textContent=i+1;b.onclick=()=>{current=i;renderQ()};g.append(b)})}
function submitTest(auto=false){if(submitted)return;if(!auto&&!confirm('Submit your test now?'))return;submitted=true;clearInterval(timerInt);let correct=answers.reduce((n,a,i)=>n+(a===QUESTIONS[i].ans?1:0),0),attempted=answers.filter(a=>a!==null).length,wrong=attempted-correct,unanswered=QUESTIONS.length-attempted;document.getElementById('quizContainer').style.display='none';let r=document.getElementById('result');r.style.display='block';document.getElementById('scoreNum').textContent=correct+'/'+QUESTIONS.length;document.getElementById('resultTitle').textContent=correct===QUESTIONS.length?'Excellent work! 🎉':correct>=Math.ceil(QUESTIONS.length/2)?'Good effort! 👍':'Keep practicing! 💪';document.getElementById('resultDesc').textContent=`${correct} correct • ${wrong} incorrect • ${unanswered} unanswered. Demo scoring: 1 point per correct answer, no negative marking.`;let review=document.getElementById('review');review.innerHTML='<h3>Answer review</h3>';QUESTIONS.forEach((q,i)=>{let d=document.createElement('div');d.className='review-item';let p=document.createElement('p'),b=document.createElement('b');b.textContent='Q'+(i+1)+'. ';p.append(b,document.createTextNode(q.q));let s=document.createElement('p');s.className=answers[i]===q.ans?'correct':answers[i]===null?'':'wrong';s.textContent=answers[i]===null?'Not answered':answers[i]===q.ans?'Correct':'Incorrect';let y=document.createElement('p');y.textContent='Your answer: '+(answers[i]===null?'Not answered':q.options[answers[i]]);let a=document.createElement('p');a.textContent='Correct answer: '+q.options[q.ans];let e=document.createElement('p');e.className='muted';e.textContent='Explanation: '+(q.exp||'Review the correct answer.');d.append(p,s,y,a,e);review.append(d)});window.scrollTo(0,0)}
document.getElementById('prev').onclick=()=>{if(current>0){current--;renderQ()}};document.getElementById('next').onclick=()=>{if(current<QUESTIONS.length-1){current++;renderQ()}};document.getElementById('clear').onclick=()=>{answers[current]=null;renderQ()};document.getElementById('submit').onclick=()=>submitTest(false);
function tick(){if(submitted)return;time--;document.getElementById('timer').textContent=String(Math.floor(Math.max(0,time)/60)).padStart(2,'0')+':'+String(Math.max(0,time)%60).padStart(2,'0');if(time<=0)submitTest(true)}timerInt=setInterval(tick,1000);renderQ();
</script></body></html>
