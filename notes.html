<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Notes - ReasonIQ99</title><style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f8f9ff}.nav{background:white;padding:15px 18px;display:flex;justify-content:space-between}.nav a{color:#6c3bff;text-decoration:none;font-weight:700}.card{background:white;margin:12px auto;max-width:850px;border-radius:16px;padding:18px;box-shadow:0 4px 20px #00000008;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.btn{background:#6c3bff;color:white;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700}.muted{color:#666;font-size:14px}</style></head><body><nav class="nav"><a href="index.html">← Home</a><b>ReasonIQ99 · PDFs</b></nav><h2 style="text-align:center;padding:20px">Notes & PDFs</h2><div id="list"></div><script src="data.js"></script><script>document.getElementById('list').innerHTML=NOTES.map(n=>`<section class="card"><div><b>${n.title}</b><p class="muted" style="margin-top:6px">${n.topic} • ${n.size}</p></div><a class="btn" href="${n.link}" target="_blank" rel="noopener">Open PDF ↗</a></section>`).join('');</script></body></html>
