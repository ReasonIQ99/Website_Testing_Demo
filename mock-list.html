<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Tests - ReasonIQ99</title><style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f8f9ff}.nav{background:white;padding:15px 18px;display:flex;justify-content:space-between}.nav a{color:#6c3bff;text-decoration:none;font-weight:700}.card{background:white;margin:12px auto;max-width:850px;border-radius:16px;padding:18px;box-shadow:0 4px 20px #00000008;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.btn{background:#6c3bff;color:white;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700}.muted{color:#666;font-size:14px}</style></head><body><nav class="nav"><a href="index.html">← Home</a><b>ReasonIQ99 · Mock Tests</b></nav><h2 style="text-align:center;padding:20px 12px 4px">All Mock Tests</h2><p class="muted" style="text-align:center">Demo questions only; edit data.js to expand the question bank.</p><div id="list"></div><script src="data.js"></script><script>document.getElementById('list').innerHTML=TEST_LIST.map(t=>`<section class="card"><div><b>${t.name}</b><p class="muted" style="margin-top:6px">${(MOCK_QUESTIONS[t.id]||[]).length} sample questions • ${t.time} • ${t.attempts} listed attempts</p></div><a class="btn" href="test.html?id=${encodeURIComponent(t.id)}">Start Test →</a></section>`).join('');</script></body></html>
