<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Practice - ReasonIQ99</title><style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f8f9ff}.nav{background:white;padding:15px 18px;display:flex;justify-content:space-between}.nav a{color:#6c3bff;text-decoration:none;font-weight:700}.card{background:white;margin:16px auto;max-width:760px;padding:20px;border-radius:16px;box-shadow:0 4px 20px #00000008}.muted{color:#666;font-size:14px}.opt{padding:13px;border:2px solid #eee;border-radius:10px;margin-top:10px;cursor:pointer;background:white;text-align:left;width:100%;font-size:15px}.opt.correct{border-color:#4caf50;background:#e8f5e9}.opt.wrong{border-color:#f44336;background:#ffebee}.btn{background:#6c3bff;color:white;padding:10px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin-top:14px}</style></head><body><nav class="nav"><a href="index.html">← Home</a><b id="navTitle">ReasonIQ99 · Practice</b></nav><h2 id="topicTitle" style="text-align:center;padding:20px 12px 0">Topic Practice</h2><section class="card"><p id="counter" class="muted"></p><div id="qBox" style="margin-top:14px"></div><p id="feedback" style="margin-top:12px;font-weight:650" aria-live="polite"></p><button id="next" class="btn" style="display:none">Next question →</button></section><script src="data.js"></script><script>
const p=new URLSearchParams(location.search),topic=PRACTICE_TOPICS.find(t=>t.id===(p.get('topic')||'syllogism')),qs=Object.values(MOCK_QUESTIONS).flat();document.getElementById('topicTitle').textContent=(topic?topic.icon+' '+topic.name:'🧩 Reasoning')+' Practice';document.getElementById('navTitle').textContent=(topic?topic.name:'Reasoning')+' Practice';let idx=0,locked=false;
function showQ(){locked=false;let q=qs[idx];document.getElementById('counter').textContent=`Demo question ${idx+1} of ${qs.length}`;document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';let box=document.getElementById('qBox');box.innerHTML='';let h=document.createElement('h3');h.textContent=q.q;box.append(h);q.options.forEach((op,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+op;b.onclick=()=>check(i);box.append(b)})}
function check(i){if(locked)return;locked=true;let q=qs[idx];document.querySelectorAll('.opt').forEach((el,j)=>{if(j===q.ans)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});document.getElementById('feedback').textContent=(i===q.ans?'Correct! 🎉 ':'Not quite. Correct answer: ')+q.options[q.ans]+' — '+(q.exp||'');document.getElementById('next').style.display='inline-block'}document.getElementById('next').onclick=()=>{idx=(idx+1)%qs.length;showQ()};showQ();
</script></body></html>
